[project]
name = "rddl-eval"
version = "0.1.0"
description = "Harness for measuring how well a local LLM generates valid RDDL"
requires-python = ">=3.11"
dependencies = [
    "pyRDDLGym>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rddl_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rddlgym: needs pyRDDLGym (skip with -m 'not rddlgym')",
]
filterwarnings = ["ignore::UserWarning"]
